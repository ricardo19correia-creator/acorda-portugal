<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Base Vignette & Safe Zones -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#020617" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.98"/>
    </radialGradient>
    <radialGradient id="center-clear" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </radialGradient>
    <pattern id="grid-pattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(16, 185, 129, 0.05)" stroke-width="1"/>
      <circle cx="60" cy="0" r="1.5" fill="rgba(16, 185, 129, 0.15)"/>
    </pattern>
    <pattern id="hex-pattern" width="80" height="138.56" patternUnits="userSpaceOnUse">
      <path d="M40,0 L80,23.09 L80,69.28 L40,92.38 L0,69.28 L0,23.09 Z" fill="none" stroke="rgba(6, 182, 212, 0.04)" stroke-width="1"/>
      <path d="M40,92.38 L80,115.47 L80,161.66 L40,184.75 L0,161.66 L0,115.47 Z" fill="none" stroke="rgba(6, 182, 212, 0.04)" stroke-width="1"/>
    </pattern>
    
  <linearGradient id="splash-glow" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#059669" stop-opacity="0.4"/>
    <stop offset="50%" stop-color="#047857" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
  </linearGradient>
  <radialGradient id="portal-glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#10b981" stop-opacity="0.5"/>
    <stop offset="30%" stop-color="#06b6d4" stop-opacity="0.2"/>
    <stop offset="70%" stop-color="#050706" stop-opacity="0"/>
  </radialGradient>

  </defs>
  <!-- Background Deep Base -->
  <rect width="100%" height="100%" fill="#030712"/>
  
  <rect width="100%" height="100%" fill="url(#splash-glow)"/>
  <rect width="100%" height="100%" fill="url(#grid-pattern)"/>
  <circle cx="960" cy="540" r="480" fill="url(#portal-glow)"/>
  <circle cx="960" cy="540" r="380" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="12 8" opacity="0.4"/>
  <circle cx="960" cy="540" r="440" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="6 14" opacity="0.3"/>
  <path d="M960,100 L960,980 M520,540 L1400,540" stroke="rgba(16, 185, 129, 0.15)" stroke-width="1"/>
  <!-- Constellation Nodes (Portugal silhouette nodes) -->
  <path d="M920,320 L960,260 L1020,340 L1000,460 L940,580 L920,720 L960,780" fill="none" stroke="rgba(16, 185, 129, 0.35)" stroke-width="2"/>
  <circle cx="960" cy="260" r="5" fill="#34d399" filter="drop-shadow(0 0 8px #10b981)"/>
  <circle cx="1020" cy="340" r="4" fill="#38bdf8"/>
  <circle cx="1000" cy="460" r="6" fill="#fbbf24" filter="drop-shadow(0 0 10px #f59e0b)"/>
  <circle cx="940" cy="580" r="5" fill="#34d399"/>
  <circle cx="920" cy="720" r="4" fill="#38bdf8"/>
  <circle cx="960" cy="780" r="6" fill="#10b981"/>

  <!-- Global Vignette Overlay for UI Safe Zone -->
  <rect width="100%" height="100%" fill="url(#vignette)"/>
</svg>