<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Base Vignette & Safe Zones -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#020617" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.98"/>
    </radialGradient>
    <radialGradient id="center-clear" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </radialGradient>
    <pattern id="grid-pattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(16, 185, 129, 0.05)" stroke-width="1"/>
      <circle cx="60" cy="0" r="1.5" fill="rgba(16, 185, 129, 0.15)"/>
    </pattern>
    <pattern id="hex-pattern" width="80" height="138.56" patternUnits="userSpaceOnUse">
      <path d="M40,0 L80,23.09 L80,69.28 L40,92.38 L0,69.28 L0,23.09 Z" fill="none" stroke="rgba(6, 182, 212, 0.04)" stroke-width="1"/>
      <path d="M40,92.38 L80,115.47 L80,161.66 L40,184.75 L0,161.66 L0,115.47 Z" fill="none" stroke="rgba(6, 182, 212, 0.04)" stroke-width="1"/>
    </pattern>
    
  <radialGradient id="def-ruby" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="#e11d48" stop-opacity="0.2"/>
    <stop offset="40%" stop-color="#4c0519" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#020617" stop-opacity="0.98"/>
  </radialGradient>

  </defs>
  <!-- Background Deep Base -->
  <rect width="100%" height="100%" fill="#030712"/>
  
  <rect width="100%" height="100%" fill="url(#def-ruby)"/>
  <rect width="100%" height="100%" fill="url(#grid-pattern)"/>
  <line x1="400" y1="200" x2="1520" y2="880" stroke="rgba(225, 29, 72, 0.12)" stroke-width="2"/>
  <line x1="1520" y1="200" x2="400" y2="880" stroke="rgba(225, 29, 72, 0.12)" stroke-width="2"/>
  <circle cx="960" cy="540" r="300" fill="none" stroke="rgba(225, 29, 72, 0.2)" stroke-width="1"/>

  <!-- Global Vignette Overlay for UI Safe Zone -->
  <rect width="100%" height="100%" fill="url(#vignette)"/>
</svg>